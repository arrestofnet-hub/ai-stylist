services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
    env_file:
      - .env
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - stylist-data:/app/data
      - stylist-uploads:/app/uploads
      - stylist-generated:/app/generated
    restart: unless-stopped

  mcp:
    build: .
    command: python mcp_server.py
    env_file:
      - .env
    ports:
      - "127.0.0.1:8011:8011"
    volumes:
      - stylist-data:/app/data
      - stylist-uploads:/app/uploads
      - stylist-generated:/app/generated
    restart: unless-stopped

volumes:
  stylist-data:
  stylist-uploads:
  stylist-generated:
