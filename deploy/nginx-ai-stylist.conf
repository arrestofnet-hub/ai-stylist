server {
    listen 80;
    server_name stylist.example.com;

    client_max_body_size 20m;

    # Public MCP endpoint used by ChatGPT / MCP clients.
    location /mcp {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # RFC 9728 discovery endpoint automatically exposed by the mounted MCP app
    # whenever MCP_AUTH_ENABLED=true.
    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Plugin directory verification and public policy pages.
    location = /.well-known/openai-apps-challenge {
        proxy_pass http://127.0.0.1:8010/.well-known/openai-apps-challenge;
        proxy_http_version 1.1;
        access_log off;
    }

    location = /privacy {
        proxy_pass http://127.0.0.1:8010/privacy;
        proxy_http_version 1.1;
    }

    location = /terms {
        proxy_pass http://127.0.0.1:8010/terms;
        proxy_http_version 1.1;
    }

    location = /support {
        proxy_pass http://127.0.0.1:8010/support;
        proxy_http_version 1.1;
    }

    # Simple liveness check. It intentionally contains no secrets.
    location = /health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_http_version 1.1;
        access_log off;
    }

    # Do not expose the internal REST/admin API on the public plugin hostname.
    # A future standalone web client should get its own authenticated API gateway.
    location / {
        return 404;
    }
}
